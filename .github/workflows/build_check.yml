name: Build Check

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

jobs:
  # ┌─────────────────────────────────────────────────────────┐
  # │  Quality gate                                            │
  # │  Format (150 cols) + Analyze + Unit tests                │
  # │  Mirrors scripts/before_push.dart so local and CI agree. │
  # └─────────────────────────────────────────────────────────┘
  validate:
    name: "Format, Analyze & Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'

      - name: "Install dependencies"
        run: flutter pub get

      - name: "Check Dart formatting (150 columns)"
        run: dart ./scripts/format_check.dart

      - name: "Run static analysis"
        run: flutter analyze --no-fatal-infos .

      - name: "Run unit tests"
        run: flutter test